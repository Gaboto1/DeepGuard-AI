version: "3.9"

# DeepGuard AI — Enterprise Production Deployment
# ================================================
# Arquitectura de 4 servicios:
#   1. redis      — Message broker y result backend para Celery
#   2. api        — FastAPI ultra-ligero (sin modelos GPU, solo routing)
#   3. worker     — Celery worker con GPU exclusivo (carga todos los modelos)
#   4. frontend   — Next.js 14 estático
#
# Uso:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   GPU: requiere NVIDIA Container Toolkit instalado en el host.
#
# Variables de entorno recomendadas (.env):
#   DEEPGUARD_SIGNING_KEY=<clave-larga-aleatoria>
#   REDIS_URL=redis://redis:6379/0
#   REDIS_BACKEND=redis://redis:6379/1

services:

  # ── Redis — Message broker + result backend ────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: deepguard-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 100
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI — API ultra-ligera (sin GPU, sin modelos) ─────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepguard-api
    restart: unless-stopped
    environment:
      - DEVICE=cpu                          # API no usa GPU
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BACKEND=redis://redis:6379/1
      - DEEPGUARD_SIGNING_KEY=${DEEPGUARD_SIGNING_KEY:-change-me-in-production}
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - FILE_CLEANUP_HOURS=24
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./reports:/app/reports
      - ./backend/logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --workers 4
      --log-level info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Celery Worker — GPU exclusivo con todos los modelos ───────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepguard-worker
    restart: unless-stopped
    environment:
      - DEVICE=cuda
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BACKEND=redis://redis:6379/1
      - DEEPGUARD_SIGNING_KEY=${DEEPGUARD_SIGNING_KEY:-change-me-in-production}
      - TRANSFORMERS_CACHE=/app/models
      - HF_HOME=/app/models
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - FILE_CLEANUP_HOURS=24
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
      - ./reports:/app/reports
      - ./backend/logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    # GPU passthrough (requiere NVIDIA Container Toolkit)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      celery -A app.celery_app.celery_app worker
      --loglevel=info
      --concurrency=1
      --queues=images,videos,default
      --hostname=deepguard-gpu-worker@%h
      --max-tasks-per-child=100
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d deepguard-gpu-worker@$(hostname) || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 3

  # ── Worker de limpieza automática (opcional) ──────────────────────────────
  worker-cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: deepguard-cleanup
    restart: unless-stopped
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_BACKEND=redis://redis:6379/1
      - FILE_CLEANUP_HOURS=24
    volumes:
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    depends_on:
      - redis
    command: >
      celery -A app.celery_app.celery_app beat
      --loglevel=warning
      --scheduler celery.beat:PersistentScheduler

  # ── Nginx reverse proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: deepguard-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - frontend

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: deepguard-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  redis_data:
    driver: local

networks:
  default:
    name: deepguard-net
    driver: bridge
